plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'org.jetbrains.kotlin.jvm' version '2.2.20'
}

repositories {
	// Aliyun mirrors Maven Central (repo1.maven.org is unreachable/slow here)
	maven { url = 'https://maven.aliyun.com/repository/public' }
	mavenCentral()
	maven { url = 'https://maven.impactdev.net/repository/development/' } // Cobblemon
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"cobblemoneditor" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20"

	// Cobblemon API: compile-only (players install Cobblemon themselves)
	modCompileOnly "com.cobblemon:fabric:${project.cobblemon_version}"
	// Dev runtime so the dev client actually launches with Cobblemon
	modLocalRuntime "com.cobblemon:fabric:${project.cobblemon_version}"
}

processResources {
	inputs.property "version", project.mod_version
	filesMatching("fabric.mod.json") {
		expand "version": project.mod_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

kotlin {
	jvmToolchain(21)
}

base {
	archivesName = "${project.archives_base_name}-${project.mod_version}"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
