org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# Loom 1.18 needs JVM 25 to run; compile target stays Java 21
org.gradle.java.installations.paths=C:/Program Files/Zulu/zulu-21,C:/Program Files/Zulu/zulu-25
# maven.fabricmc.net is flaky from here: fail fast, retry a few times
systemProp.org.gradle.internal.http.connectionTimeout=20000
systemProp.org.gradle.internal.http.socketTimeout=120000
org.gradle.internal.repository.max.retries=6
org.gradle.internal.repository.initial.backoff=1000
org.gradle.internal.repository.max.tentatives=6

# Fabric (1.21.1, from official fabric-example-mod)
minecraft_version=1.21.1
loader_version=0.19.5
loom_version=1.18-SNAPSHOT
fabric_api_version=0.116.17+1.21.1

# Mod
mod_version=0.3.8
maven_group=com.xiaoyu
archives_base_name=cobblemoneditor

# Cobblemon
cobblemon_version=1.8.1+1.21.1
